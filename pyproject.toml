[project]
name = "julius-berti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "torch==2.6.0+cu126",
  "torchvision==0.21.0+cu126",
  "torchaudio==2.6.0+cu126",
  "transformers>=4.48,<5",
  "accelerate>=1.3.0,<2",
  "pytest~=8.0",
  "numpy~=1.21",
  "mypy~=1.9",
  "gluonts[pro]~=0.15",
  "datasets~=2.18",
  "typer",
  "typer-config",
  "joblib",
  "scikit-learn",
  "tensorboard",
  "ConfigSpace",
  "smac",
  "dask",
  "dask-jobqueue",
  "autogluon",
  "ucimlrepo",
  "normality<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
