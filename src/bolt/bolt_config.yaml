training_data_paths: 
  - "./data/train/kernelsynth.arrow"
  - "./data/train/training_mix.arrow"


probability:
 - 0.1
 - 0.9


# TODO max_per_device_train_batch_size * gradient_accumulation_steps * #Devices == 8192 as by roberta
max_per_device_train_batch_size: 256
gradient_accumulation_steps: 32
max_steps: 10000 # TODO 500000
save_steps: 1000
log_steps: 50 # TODO
num_samples: 20
shuffle_buffer_length: 100000

model_id: "google-bert/bert-base-cased"
model_type: "mlm"
task: "mlm"

fp16: true
random_init: true
tf32: true
torch_compile: false # TODO
dataloader_num_workers: 0
use_eos_token: true

prediction_length: 1 # TODO Remove prediction length completly

n_special_tokens: 4
pad_token_id: 0
bos_token_id: 1
eos_token_id: 2
mask_token_id: 3

bolt: true
context_length: 4096 # TODO Increase

hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
intermediate_size: 3072
hidden_act: "gelu"
hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.1
layer_norm_eps: 1.0e-12 # TODO 1e-5? as in Roberta?

use_reg_token: false
span_masking: false # TODO

n_tokens: 4096
tokenizer_limit: 15
tokenizer_class: "MeanScaleUniformBins"

#Patching debug
debug_patching: false
debug_batch_idx: 0
debug_max_patches: 3

# Fixed training config
batch_size: 32
learning_rate: 6.0e-4
warmup_ratio: 0.048 
adam_beta1: 0.9
adam_beta2: 0.98
adam_epsilon: 1e-6
weight_decay: 0.01
max_grad_norm: 0.0
warmup_steps: 24_000 # Overwrites warmup_ratio
optim: "adamw_torch_fused"
max_missing_prop: 0.9
drop_prob: 0.2 # TODO
lr_scheduler_type: "linear"
min_past: 64

mean_span_length: 1 # TODO 20
masking_prob: 0.15

# Patching defaults
patch_size: 16
patch_stride: 16
individual_dropout: 0.05
unchanged_patch_prob: 0.10
patch_masking_prob: 0.80
patch_perturbation_prob: 0.1 # TODO
patch_perturbation_scale_strength: 0.1
patch_perturbation_noise_strength: 0.1


