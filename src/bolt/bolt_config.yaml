training_data_paths: 
  - "./data/train/kernelsynth.arrow"
#  - "/data/horse/ws/juha972b-AION-BERT-Chronos/BERTi/data/train/training_mix.arrow" TODO

probability:
 - 1.0
#  - 0.1 # TODO 

max_per_device_train_batch_size: 32
max_steps: 200000
save_steps: 200000
log_steps: 500
num_samples: 20
shuffle_buffer_length: 100000

model_id: "prajjwal1/bert-small"
model_type: "mlm"
task: "mlm"

fp16: true
random_init: true
tf32: true
torch_compile: false # TODO
dataloader_num_workers: 0
use_eos_token: true

prediction_length: 64

n_special_tokens: 4
pad_token_id: 0
bos_token_id: 1
eos_token_id: 2
mask_token_id: 3

bolt: true
context_length: 512

hidden_size: 512
num_hidden_layers: 4
num_attention_heads: 8
intermediate_size: 2048
hidden_act: "gelu"
hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.1
layer_norm_eps: 1.0e-12

use_reg_token: false
span_masking: false # TODO

n_tokens: 4096
tokenizer_limit: 15
tokenizer_class: "MeanScaleUniformBins"

#Patching debug
debug_patching: false
debug_batch_idx: 0
debug_max_patches: 3

# Fixed training config
batch_size: 32
learning_rate: 1.0e-4
warmup_ratio: 0.01
optim: "adamw_torch_fused"
max_missing_prop: 0.9
drop_prob: 0.2
lr_scheduler_type: "linear"
min_past: 60

mean_span_length: 1 # TODO 20
masking_prob: 0.15

# Patching defaults
patch_size: 16
patch_stride: 16
individual_dropout: 0.05
perturbation_prob: 0.05
perturbation_strength: 0.1
unchanged_patch_prob: 0.05
patch_perturbation_prob: 0.0 # TODO
patch_perturbation_scale_strength: 0.1
patch_perturbation_noise_strength: 0.1


