training_data_paths:
- "/content/CodeDiplomaThesis/data/finetuning/Imputation/monash_electricity_weekly.arrow"

probability:
- 1.0

model_id: "juliushanusch/ChronosBERT-Optimized"
#Best Overall
model_type: mlm                 
random_init: false              
tie_embeddings: false          
tokenizer_class: "MeanScaleUniformBins" 
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0

n_tokens: 4096            
n_special_tokens: 4        
pad_token_id: 0
bos_token_id: 1
eos_token_id: 2
mask_token_id: 3           
use_eos_token: true
task: "mlm"
dropout_head: 0.1
TrainInnerModel: true

span_masking: true
mean_span_length: 5
masking_prob: 0.15

context_length: 512
prediction_length: 1
min_past: 60

max_steps: 1000
save_steps: 1000
log_steps: 100
per_device_train_batch_size: 32

learning_rate: 1e-4

optim: adamw_torch_fused
gradient_accumulation_steps: 1
shuffle_buffer_length: 10000   
lr_scheduler_type: linear
warmup_ratio: 0.01            
dataloader_num_workers: 1
max_missing_prop: 0.9
num_samples: 20
temperature: 1.0
top_k: 50
top_p: 1.0
num_labels: 6

# ============================
# Output / System
# ============================
output_dir: ./FineTunedModels/Imputation/
tf32: true
torch_compile: true

# ============================
# HF Extras
# ============================
cache_dir: /tmp/hf-cache
trust_remote_code: false
model_revision: main
torch_dtype: float32
